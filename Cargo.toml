[package]
name = "git-time-machine"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"

[dependencies]
git2 = { version = "0.17", default-features = false }
chrono = "0.4"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1"

# Pin dependencies for compatibility
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { version = "=0.4.31" }

[[bin]]
name = "git-time-machine"
path = "src/main.rs"
